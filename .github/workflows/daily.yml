name: daily-update

# 매일 1회 데이터를 갱신해 docs/data 를 커밋한다.
# GitHub Pages는 Settings → Pages 에서 "Deploy from branch: main / docs" 로 설정.
on:
  schedule:
    - cron: "0 12 * * *"   # 매일 12:00 UTC (한국 21:00)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/indicators.json docs/data/data.js
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 매크로 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi
