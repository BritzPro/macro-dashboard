<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>매크로 대시보드</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>매크로 대시보드</h1>
      <div class="meta">
        <span id="source-badge" class="badge">—</span>
        <span id="updated" class="updated">—</span>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">종합 상황판</button>
      <button class="tab" data-tab="d">매일</button>
      <button class="tab" data-tab="w">매주</button>
      <button class="tab" data-tab="m">매월</button>
    </nav>
  </header>

  <main id="view"><!-- 렌더링 영역 --></main>

  <footer class="foot">
    <p>데이터 출처: FRED (Federal Reserve Bank of St. Louis). 이 페이지는 교육용이며 투자조언이 아니다.</p>
  </footer>

  <!-- 축 심층 해설 모달 (종합 상황판의 축 카드 클릭 시 열림) -->
  <div id="axis-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <div id="am-name" class="modal-name"></div>
          <div id="am-sub" class="modal-sub"></div>
        </div>
        <button id="am-close" class="modal-close" aria-label="닫기">✕</button>
      </div>
      <div id="am-body" class="axis-body"></div>
    </div>
  </div>

  <!-- 확대 차트 모달 (지표 카드 차트 클릭 시 열림) -->
  <div id="chart-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <div id="cm-name" class="modal-name"></div>
          <div id="cm-sub" class="modal-sub"></div>
        </div>
        <button id="cm-close" class="modal-close" aria-label="닫기">✕</button>
      </div>
      <div id="cm-ranges" class="ranges"></div>
      <div id="cm-stats" class="chart-stats"></div>
      <div id="cm-chart" class="chart-area"></div>
      <div id="cm-interp" class="modal-interp"></div>
    </div>
  </div>

  <!-- 빌드가 생성하는 데이터. file:// 로 열어도 동작하도록 script로 주입 -->
  <script src="data/data.js"></script>
  <script src="app.js"></script>
</body>
</html>
